name: SAF Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-room-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run pipeline
        run: python automation/saf_pipeline.py examples/room-booking --build-dir build
      - name: Verify DOCX
        run: test -s build/room-booking.docx
